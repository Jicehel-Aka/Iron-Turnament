name: AKA release

# Déclenché par un tag (git tag v1.0.0 && git push origin v1.0.0) ou à la main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de la release (ex. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  firmware-sd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: aka
      - name: Dossier carte SD
        run: |
          mkdir -p out/IRONTOURNAMENT
          cp -r aka/sd/IRONTOURNAMENT/. out/IRONTOURNAMENT/
          cp aka/build/irontournament.bin out/IRONTOURNAMENT/firmware.bin
          cd out && zip -r ../IronTournament-AKA-SD-${TAG}.zip IRONTOURNAMENT
      - uses: actions/upload-artifact@v4
        with:
          name: rel-sd
          path: IronTournament-AKA-SD-*.zip

  pc-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - run: cmake -S aka/pc -B build-pc -DCMAKE_BUILD_TYPE=Release && cmake --build build-pc -j
      - name: Archive
        run: |
          mkdir -p IronTournament-PC-linux
          cp build-pc/irontournament IronTournament-PC-linux/
          cp -r aka/sd/IRONTOURNAMENT IronTournament-PC-linux/
          tar czf IronTournament-PC-linux-${TAG}.tar.gz IronTournament-PC-linux
      - uses: actions/upload-artifact@v4
        with:
          name: rel-linux
          path: IronTournament-PC-linux-*.tar.gz

  pc-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-SDL2 zip
      - run: cmake -S aka/pc -B build-pc -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build-pc
      - name: Archive (exe + SDL2.dll + données)
        run: |
          mkdir IronTournament-PC-windows
          cp -r aka/sd/IRONTOURNAMENT IronTournament-PC-windows/IRONTOURNAMENT
          cp build-pc/irontournament.exe IronTournament-PC-windows/irontournament.exe
          cp /mingw64/bin/SDL2.dll IronTournament-PC-windows/SDL2.dll
          zip -r IronTournament-PC-windows-${TAG}.zip IronTournament-PC-windows
      - uses: actions/upload-artifact@v4
        with:
          name: rel-windows
          path: IronTournament-PC-windows-*.zip

  publish:
    needs: [firmware-sd, pc-linux, pc-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rel-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Iron Tournament ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*
